<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senderos del Chaco - Decisiones Históricas</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Georgia, 'Segoe UI', serif;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at 30% 20%, #4a5a2e, #2a3318 60%, #141a0c);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  color: #2b1f0f;
}

.game {
  width: 100%;
  max-width: 950px;
  background: #f4ecd8;
  border: 5px solid #2a3318;
  border-radius: 14px;
  box-shadow: 0 25px 80px rgba(0,0,0,.7);
  overflow: hidden;
}

header {
  background: linear-gradient(90deg,#2a3318,#4a5a2e);
  color: #f4ecd8;
  padding: 16px 22px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

header h1 {
  font-size: 1.1rem;
  letter-spacing: 2px;
}

.turn {
  font-size: .82rem;
  background: rgba(0,0,0,.3);
  padding: 6px 12px;
  border-radius: 14px;
}

.meters {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
}

.meter {
  font-size: .76rem;
}

.label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
  color: #e8dcb8;
}

.bar {
  height: 10px;
  background: rgba(0,0,0,.4);
  border-radius: 6px;
  overflow: hidden;
}

.fill {
  height: 100%;
  border-radius: 6px;
  transition: width .5s;
}

.tension { background: #c9a227; }
.tension.high { background: #e53935; }
.diplo { background: #4fc3f7; }
.pres { background: #81c784; }

.screen {
  padding: 25px 28px;
  min-height: 490px;
  display: flex;
  flex-direction: column;
}

.tag {
  display: inline-block;
  background: #2a3318;
  color: #f4ecd8;
  font-size: .68rem;
  padding: 5px 12px;
  border-radius: 14px;
  margin-bottom: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

h2 {
  color: #2a3318;
  margin-bottom: 12px;
  font-size: 1.4rem;
}

.context {
  line-height: 1.6;
  font-size: .96rem;
  margin-bottom: 8px;
  color: #3a2c14;
}

.story {
  background: #e8dcb8;
  padding: 14px 16px;
  border-radius: 10px;
  border-left: 5px solid #7a5c2e;
  margin-bottom: 16px;
}

.historical-photo {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 10px;
  border: 3px solid #7a5c2e;
  box-shadow: 0 4px 12px rgba(0,0,0,.25);
  margin-bottom: 10px;
  background: #2a3318;
}

.photo-caption {
  font-size: .7rem;
  color: #7a5c2e;
  text-align: right;
  margin-bottom: 14px;
  font-style: italic;
}

.choices {
  display: grid;
  gap: 10px;
  margin-top: auto;
}

.choice {
  background: white;
  border: 2px solid #c2a878;
  border-radius: 10px;
  padding: 13px;
  cursor: pointer;
  text-align: left;
  font-size: .94rem;
  transition: .2s;
  color: #2b1f0f;
}

.choice:hover:not(:disabled) {
  background: #f9f1dd;
  border-color: #7a5c2e;
  transform: translateX(4px);
}

.choice:disabled {
  opacity: .65;
  cursor: default;
}

.ch-title {
  font-weight: bold;
  display: block;
  margin-bottom: 4px;
}

.ch-sub {
  font-size: .8rem;
  color: #7a5c2e;
  font-style: italic;
}

.outcome {
  margin-top: 14px;
  padding: 14px;
  border-radius: 10px;
  font-size: .91rem;
  line-height: 1.55;
  display: none;
  background: #e8dcb8;
  border-left: 5px solid #4a5a2e;
}

.outcome.show {
  display: block;
  animation: fade .4s;
}

.delta {
  margin-top: 8px;
  font-size: .85rem;
  font-weight: bold;
}

.delta span {
  display: inline-block;
  margin-right: 10px;
}

.up { color: #c62828; }
.down { color: #2e7d32; }
.neu { color: #7a5c2e; }

@keyframes fade {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.btn {
  margin-top: 17px;
  align-self: flex-end;
  background: linear-gradient(90deg,#4a5a2e,#7a8c3a);
  color: white;
  border: none;
  padding: 12px 27px;
  font-size: .95rem;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  letter-spacing: 1px;
}

.btn:hover {
  filter: brightness(1.12);
}

.btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.country-pick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 20px 0;
}

.country-card {
  background: white;
  border: 3px solid #c2a878;
  border-radius: 14px;
  padding: 20px;
  cursor: pointer;
  text-align: center;
  transition: .2s;
}

.country-card:hover {
  border-color: #7a5c2e;
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
}

.flag {
  font-size: 2.5rem;
  margin-bottom: 8px;
}

.name {
  font-weight: bold;
  font-size: 1.1rem;
  color: #2a3318;
}

.desc {
  font-size: .8rem;
  color: #6b5a3a;
  margin-top: 6px;
  line-height: 1.4;
}

.center {
  text-align: center;
}

.final-badge {
  font-size: 3.5rem;
  text-align: center;
  margin: 10px;
}

.final-title {
  font-size: 1.5rem;
  text-align: center;
  color: #2a3318;
  margin-bottom: 8px;
}

.final-sub {
  text-align: center;
  font-size: .95rem;
  color: #6b5a3a;
  margin-bottom: 16px;
  font-style: italic;
}

.final-box {
  background: #e8dcb8;
  padding: 16px;
  border-radius: 12px;
  border-left: 5px solid #7a5c2e;
  line-height: 1.6;
  margin-bottom: 14px;
  font-size: .93rem;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 14px 0;
}

.result-item {
  background: white;
  border: 1px solid #c2a878;
  border-radius: 9px;
  padding: 12px 5px;
  text-align: center;
  font-size: .82rem;
}

.result-item strong {
  display: block;
  font-size: 1.3rem;
  color: #4a5a2e;
  margin-top: 5px;
}

footer {
  background: #2a3318;
  color: #a8b080;
  padding: 10px;
  text-align: center;
  font-size: .7rem;
  letter-spacing: 1px;
}

@media(max-width:600px) {
  body { padding: 8px; }
  .screen { padding: 18px 14px; }
  .country-pick { grid-template-columns: 1fr; }
  .meters { gap: 5px; }
  .meter { font-size: .65rem; }
  .historical-photo { height: 210px; }
  header h1 { font-size: .95rem; }
}
</style>
</head>

// ================= FUNCIONES =================

function clamp(v) {
  return Math.max(0,Math.min(100,v));
}

function updateMeters() {
  state.tension=clamp(state.tension);
  state.diplomacy=clamp(state.diplomacy);
  state.presence=clamp(state.presence);

  $('tVal').textContent=Math.round(state.tension);
  $('dVal').textContent=Math.round(state.diplomacy);
  $('pVal').textContent=Math.round(state.presence);

  $('tBar').style.width=state.tension+'%';
  $('dBar').style.width=state.diplomacy+'%';
  $('pBar').style.width=state.presence+'%';

  $('tBar').classList.toggle('high',state.tension>=70);
}

// ================= PANTALLA INICIAL =================

function startScreen() {
  state.tension=15;
  state.diplomacy=50;
  state.presence=30;
  state.turn=0;
  state.country=null;
  state.choices=[];

  updateMeters();
  $('turnLabel').textContent='Elige tu país';

  screen.innerHTML=`
    <div class="center">
      <span class="tag">Prólogo histórico</span>
    </div>

    <h2 class="center">Elige tu país</h2>

    <p class="context center">
      Asume el liderazgo de una nación en vísperas de la Guerra del Chaco (1932–1935).
      Tus decisiones modificarán los indicadores de tensión, diplomacia y presencia.
    </p>

    <div class="country-pick">

      <div class="country-card" onclick="chooseCountry('Bolivia')">
        <div class="flag">🇧🇴</div>
        <div class="name">Bolivia</div>
        <div class="desc">
          Busca consolidar su presencia en el Chaco y alcanzar una conexión fluvial hacia el Atlántico.
        </div>
      </div>

      <div class="country-card" onclick="chooseCountry('Paraguay')">
        <div class="flag">🇵🇾</div>
        <div class="name">Paraguay</div>
        <div class="desc">
          Defiende sus reclamaciones territoriales y su presencia histórica en el Chaco Boreal.
        </div>
      </div>

    </div>

    <p class="context center">
      <i>Tu misión es comprender las decisiones y acontecimientos que precedieron a la guerra.</i>
    </p>
  `;
}

function chooseCountry(c) {
  state.country=c;
  showEvent();
}

// ================= MOSTRAR ACONTECIMIENTOS =================

function showEvent() {

  if(state.turn>=EVENTS.length) {
    finalScreen();
    return;
  }

  const ev=EVENTS[state.turn];

  $('turnLabel').textContent=
    Turno ${state.turn+1} / ${EVENTS.length} · ${state.country};

  screen.innerHTML=`
    <span class="tag">${ev.tag}</span>

    <h2>${ev.title}</h2>

    <img
      class="historical-photo"
      src="${ev.img}"
      alt="${ev.title}"
      onerror="this.onerror=null;this.src='https://placehold.co/900x400/2a3318/f4ecd8?text=Imagen+historica+no+disponible';"
    >

    <div class="photo-caption">${ev.caption}</div>

    <div class="story">
      <p class="context">${ev.story}</p>
    </div>

    <p class="context"><b>¿Qué decisión tomarías?</b></p>

    <div class="choices" id="choices"></div>

    <div class="outcome" id="outcome"></div>

    <button class="btn" id="nextBtn" disabled onclick="nextEvent()">
      CONTINUAR ➜
    </button>
  `;

  const cont=$('choices');

  ev.choices.forEach((ch,i)=>{
    const b=document.createElement('button');
    b.className='choice';

    b.innerHTML=`
      <span class="ch-title">${ch.t}</span>
      <span class="ch-sub">${ch.s}</span>
    `;

    b.onclick=()=>pick(i);
    cont.appendChild(b);
  });
}

// ================= SELECCIONAR DECISIÓN =================

function pick(i) {

  const ev=EVENTS[state.turn];
  const ch=ev.choices[i];

  state.tension+=ch.d[0];
  state.diplomacy+=ch.d[1];
  state.presence+=ch.d[2];

  state.choices.push(ch.t);

  updateMeters();

  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
  });

  const delta=ch.d.map(n=>{
    const sign=n>0?'+':'';
    const color=n>0?'up':n<0?'down':'neu';
    return <span class="${color}">${sign}${n}</span>;
  });

  const outcome=$('outcome');

  outcome.innerHTML=`
    <b>Consecuencia de tu decisión:</b>

    <p>${ch.r}</p>

    <div class="delta">
      🔥 Tensión: ${delta[0]}
      🕊️ Diplomacia: ${delta[1]}
      🎖️ Presencia: ${delta[2]}
    </div>
  `;

  outcome.classList.add('show');

  $('nextBtn').disabled=false;
}

// ================= SIGUIENTE ACONTECIMIENTO =================

function nextEvent() {
  state.turn++;
  showEvent();
}

// ================= RESULTADOS FINALES =================

function finalScreen() {

  $('turnLabel').textContent='Fin de la partida';

  let title,emoji,description;

  if(state.diplomacy>=65 && state.tension<=40) {

    title='El camino de la diplomacia';
    emoji='🕊️';

    description='Tus decisiones priorizaron el diálogo, la mediación y la búsqueda de acuerdos. Aunque la crisis histórica no pudo evitarse, tu estrategia representa un esfuerzo por alcanzar una solución pacífica.';

  } else if(state.tension>=70) {

    title='Una crisis de grandes dimensiones';
    emoji='⚠️';

    description='Las decisiones aumentaron considerablemente las tensiones. Las diferencias territoriales y los incidentes fronterizos hicieron cada vez más difícil encontrar una solución pacífica.';

  } else if(state.presence>=65) {

    title='La importancia del territorio';
    emoji='🎖️';

    description='Tus decisiones dieron prioridad a la presencia territorial y al conocimiento geográfico. El Chaco tenía una gran importancia estratégica para ambos países.';

  } else {

    title='Un equilibrio difícil';
    emoji='📜';

    description='Tus decisiones combinaron diplomacia, presencia territorial y firmeza nacional. La disputa histórica demuestra lo difícil que era alcanzar un acuerdo definitivo.';
  }

  screen.innerHTML=`

    <span class="tag">Conclusión histórica</span>

    <div class="final-badge">${emoji}</div>

    <h2 class="final-title">${title}</h2>

    <p class="final-sub">
      Partida finalizada · ${state.country}
    </p>

    <div class="final-box">
      <b>Resultado de tus decisiones</b>
      <p>${description}</p>
    </div>

    <div class="result-grid">

      <div class="result-item">
        🔥 Tensión
        <strong>${Math.round(state.tension)}%</strong>
      </div>

      <div class="result-item">
        🕊️ Diplomacia
        <strong>${Math.round(state.diplomacy)}%</strong>
      </div>

      <div class="result-item">
        🎖️ Presencia
        <strong>${Math.round(state.presence)}%</strong>
      </div>

    </div>

    <div class="final-box" style="margin-top:15px">
      <b>Reflexión histórica</b>

      <p>
        La Guerra del Chaco (1932–1935) fue un conflicto entre Bolivia y Paraguay
        por el control del Chaco Boreal. Sus antecedentes incluyeron la disputa
        territorial, los problemas fronterizos, los intereses económicos,
        los fortines y las dificultades diplomáticas.
      </p>

      <p style="margin-top:8px">
        El conflicto terminó con el cese de hostilidades en 1935 y el Tratado
        de Paz, Amistad y Límites firmado en 1938.
      </p>
    </div>

    <div class="final-box">
      <b>Tus decisiones</b>

      <ol style="padding-left:20px;margin-top:8px">
        ${state.choices.map(c=><li style="margin-bottom:5px">${c}</li>).join('')}
      </ol>
    </div>

    <button class="btn" onclick="startScreen()">
      ↻ VOLVER A JUGAR
    </button>
  `;
}

// ================= INICIAR JUEGO =================

startScreen();

</script>
</body>
</html>
